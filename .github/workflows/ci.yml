name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        provider: [SqlServer, PostgreSql]

    name: Build & Test (${{ matrix.provider }})

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.CI_TEST_SA_PASSWORD }}
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_TEST_POSTGRES_PASSWORD }}
          POSTGRES_DB: TaskMaster_IntegrationTesting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d TaskMaster_IntegrationTesting"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20

    env:
      # Selects the engine the integration suite targets for this matrix leg.
      TASKMASTER_TEST_PROVIDER: ${{ matrix.provider }}
      ConnectionStrings__SqlServerTesting: Server=localhost,1433;Database=TaskMaster_IntegrationTesting;User Id=sa;Password=${{ secrets.CI_TEST_SA_PASSWORD }};TrustServerCertificate=True;
      ConnectionStrings__PostgreSqlTesting: Host=localhost;Port=5432;Database=TaskMaster_IntegrationTesting;Username=postgres;Password=${{ secrets.CI_TEST_POSTGRES_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Src/Frontend/TaskMaster.UI/package-lock.json

      - name: Restore & Build Backend
        run: dotnet build Src/Backend/TaskMaster.sln

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: Src/Frontend/TaskMaster.UI

      - name: Build Frontend
        run: npm run build
        working-directory: Src/Frontend/TaskMaster.UI

      - name: Run Unit Tests
        run: dotnet test Src/Backend/TaskMaster.Test.UnitTests --no-build --verbosity normal

      - name: Run Integration Tests (${{ matrix.provider }})
        run: dotnet test Src/Backend/TaskMaster.Test.IntegrationTests --no-build --verbosity normal
        
    ci-success:
        name: CI
        runs-on: ubuntu-latest
        needs: build-and-test

        if: ${{ always() }}

        steps:
          - name: Check CI result
            if: ${{ needs.build-and-test.result != 'success' }}
            run: |
                echo "Build and test failed."
                echo "build-and-test result: ${{ needs.build-and-test.result }}"
                exit 1

          - name: CI successful
            run: echo "All CI checks passed."
